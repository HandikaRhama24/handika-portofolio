<svg viewBox="0 0 216 216" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#202024"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A15C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E8D9B5" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <clipPath id="clip3"><circle cx="108" cy="108" r="108"/></clipPath>

  <circle cx="108" cy="108" r="108" fill="url(#bg3)"/>

  <g clip-path="url(#clip3)">
    <!-- concentric radar rings -->
    <circle cx="108" cy="108" r="90" fill="none" stroke="#55524C" stroke-width="0.75" opacity="0.4"/>
    <circle cx="108" cy="108" r="66" fill="none" stroke="#55524C" stroke-width="0.75" opacity="0.4"/>
    <circle cx="108" cy="108" r="42" fill="none" stroke="#55524C" stroke-width="0.75" opacity="0.4"/>

    <!-- crosshair lines -->
    <line x1="108" y1="0" x2="108" y2="216" stroke="#55524C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="108" x2="216" y2="108" stroke="#55524C" stroke-width="0.5" opacity="0.3"/>

    <!-- rotating sweep -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 108 108" to="360 108 108" dur="6s" repeatCount="indefinite"/>
      <path d="M108 108 L108 18 A90 90 0 0 1 172.6 43.4 Z" fill="url(#sweep)"/>
      <line x1="108" y1="108" x2="108" y2="18" stroke="#E8D9B5" stroke-width="1.3"/>
    </g>

    <!-- three "detected" pulse points -->
    <circle cx="150" cy="70" r="3" fill="#C6A15C">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="140" r="3" fill="#C6A15C">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="3" fill="#C6A15C">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center + frame -->
  <circle cx="108" cy="108" r="3.5" fill="#F7F5F0"/>
  <circle cx="108" cy="108" r="106.5" fill="none" stroke="#55524C" stroke-width="1" opacity="0.4"/>
</svg>
